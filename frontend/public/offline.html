<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RumaQ — Offline</title>
    <style>
      :root {
        --surface: oklch(0.945 0.028 230);
        --surface-raised: oklch(0.975 0.018 230);
        --text: oklch(0.28 0.03 235);
        --text-muted: oklch(0.5 0.025 235);
        --accent: oklch(0.48 0.13 230);
        --border: oklch(0.88 0.025 230);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: oklch(0.22 0.02 230);
          --surface-raised: oklch(0.28 0.02 230);
          --text: oklch(0.95 0.01 230);
          --text-muted: oklch(0.75 0.015 230);
          --accent: oklch(0.6 0.12 230);
          --border: oklch(0.4 0.02 230);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          sans-serif;
        background: var(--surface);
        color: var(--text);
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: var(--surface-raised);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 40px 32px;
        max-width: 360px;
        width: 100%;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .mark {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(150deg, var(--accent), oklch(0.42 0.14 230));
        display: grid;
        place-items: center;
        color: white;
        font-weight: 700;
        font-size: 16px;
      }
      .name {
        font-weight: 600;
        font-size: 20px;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      p {
        color: var(--text-muted);
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 24px;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        background: var(--accent);
        color: white;
        padding: 10px 20px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .status {
        margin-top: 16px;
        font-size: 13px;
        color: var(--text-muted);
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <div class="mark">Q</div>
        <div class="name">RumaQ</div>
      </div>
      <h1>You're offline</h1>
      <p>
        RumaQ needs a connection for live updates. Any changes you made will sync once you're back
        online.
      </p>
      <button id="retry" onclick="checkOnline()">Retry now</button>
      <div class="status" id="status"></div>
    </div>
    <script>
      const btn = document.getElementById('retry')
      const status = document.getElementById('status')

      function checkOnline() {
        if (navigator.onLine) {
          status.textContent = ''
          window.location.reload()
          return
        }
        status.textContent = 'Still offline. Check your connection and try again.'
        btn.disabled = true
        setTimeout(() => {
          btn.disabled = false
        }, 1500)
      }

      window.addEventListener('online', () => {
        status.textContent = 'Back online. Reloading...'
        window.location.reload()
      })
    </script>
  </body>
</html>
