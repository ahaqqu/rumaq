<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RumaQ — Offline</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        background: oklch(0.945 0.028 230);
        color: oklch(0.28 0.03 235);
        text-align: center;
        padding: 24px;
      }
      svg { margin-bottom: 24px; }
      h1 { font-size: 1.25rem; margin-bottom: 8px; }
      p { color: oklch(0.5 0.025 235); font-size: 0.9rem; max-width: 300px; }
    </style>
  </head>
  <body>
    <svg width="64" height="64" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="url(#g)" />
      <path d="M16 7 7 14.2V24a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V14.2L16 7z" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round" />
      <path d="M16 15l1.2 2.8 2.8 1.2-2.8 1.2L16 23l-1.2-2.8L12 19l2.8-1.2z" fill="#fff" />
      <defs>
        <linearGradient id="g" x1="7" y1="4" x2="25" y2="28" gradientUnits="userSpaceOnUse">
          <stop stop-color="oklch(0.62 0.13 230)" />
          <stop offset="1" stop-color="oklch(0.45 0.14 230)" />
        </linearGradient>
      </defs>
    </svg>
    <h1>You're offline</h1>
    <p>RumaQ needs an internet connection to load. Check your connection and try again.</p>
  </body>
</html>
