name = "api"
main = "src/index.ts"
compatibility_date = "2026-07-10"
compatibility_flags = ["nodejs_compat"]

# The real account_id is supplied via the CLOUDFLARE_ACCOUNT_ID environment
# variable. Wrangler reads it automatically; the placeholder below is only a
# fallback for local tooling that parses the file without env substitution.
account_id = "YOUR_ACCOUNT_ID"

[vars]
PAGES_ORIGIN = "https://rumaq.pages.dev"
EMAIL_AUTH_ENABLED = "true"
RUN_SECRETS_CHECK = "true"

[[d1_databases]]
binding = "DB"
database_name = "rumaq"

# The real database_id is supplied via the CLOUDFLARE_DATABASE_ID environment
# variable. Wrangler uses the value here as a fallback, so keep it as a
# placeholder in version control.
database_id = "YOUR_DATABASE_ID"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "rumaq-receipts"

[cache]
enabled = true

[exports.default]
type = "worker"

[exports.default.cache]
enabled = false

[exports.CachedApi]
type = "worker"

[exports.CachedApi.cache]
enabled = true
