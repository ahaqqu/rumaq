name: Cleanup branch preview

on:
  pull_request:
    types: [closed]

concurrency:
  group: cleanup-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Clean up branch Worker and deployments
        run: bash ./scripts/github/cleanup-branch.sh "${{ github.head_ref }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
