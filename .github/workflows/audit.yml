name: Daily Vulnerability Audit

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      prod_vulns: ${{ steps.prod.outputs.vulns_found }}
      all_vulns: ${{ steps.all.outputs.vulns_found }}
      fixable: ${{ steps.try_fix.outputs.fixable }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check production vulnerabilities
        id: prod
        run: |
          if npm audit --omit=dev &>/dev/null; then
            echo "vulns_found=false" >> $GITHUB_OUTPUT
          else
            echo "vulns_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Check all vulnerabilities
        id: all
        run: |
          if npm audit &>/dev/null; then
            echo "vulns_found=false" >> $GITHUB_OUTPUT
          else
            echo "vulns_found=true" >> $GITHUB_OUTPUT
            npm audit 2>&1 | tee /tmp/audit.txt
          fi

      - name: Attempt safe fix
        id: try_fix
        if: steps.prod.outputs.vulns_found == 'true' || steps.all.outputs.vulns_found == 'true'
        run: |
          npm audit fix 2>&1 || true
          if npm audit &>/dev/null; then
            echo "fixable=true" >> $GITHUB_OUTPUT
          else
            echo "fixable=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.try_fix.outputs.fixable == 'true'
        run: npm test 2>&1

      - name: Create PR
        if: steps.try_fix.outputs.fixable == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'fix: automated vulnerability patch'
          title: 'fix: automated vulnerability fixes'
          body: |
            ## Automated security fix

            `npm audit fix` resolved all vulnerabilities. Tests pass.

            _Generated by [Daily Vulnerability Audit](${{ github.server_url }}/${{ github.repository }}/actions/workflows/audit.yml)._
          branch: automation/vulnerability-fix
          base: main
          labels: security

      - name: Create issue (needs manual fix)
        if: steps.all.outputs.vulns_found == 'true' && steps.try_fix.outputs.fixable == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10)
            const title = `Vulnerabilities require manual fix — ${today}`

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security',
            })

            if (issues.some(i => i.title === title)) {
              console.log('Issue already exists, skipping')
              return
            }

            const fs = require('fs')
            const report = fs.readFileSync('/tmp/audit.txt', 'utf8')

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: '## Vulnerabilities require manual fix\n\n' +
                    '`npm audit fix` could not resolve all vulnerabilities without breaking changes.\n\n' +
                    '**Action needed:** Review and fix manually.\n\n```\n' + report + '\n```\n\n' +
                    '_Generated by [Daily Vulnerability Audit](' +
                    context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                    '/actions/workflows/audit.yml)._',
              labels: ['security'],
            })
